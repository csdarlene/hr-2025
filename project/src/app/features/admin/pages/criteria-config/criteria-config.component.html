<div class="container mx-auto px-4 py-8">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold">Evaluatiecriteria Configuratie</h1>
    <button class="btn-primary" (click)="openDialog()">
      Nieuw Criterium
    </button>
  </div>

  <div class="bg-white rounded-lg shadow-lg overflow-hidden">
    <div class="p-6">
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-2">
          Filter op Categorie
        </label>
        <select 
          [(ngModel)]="selectedCategory"
          class="form-select"
        >
          <option value="">Alle Categorieën</option>
          <option *ngFor="let category of categories" [value]="category">
            {{ getCategoryDisplay(category) }}
          </option>
        </select>
      </div>

      <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200">
          <thead class="bg-gray-50">
            <tr>
              <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                ID
              </th>
              <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                Beschrijving
              </th>
              <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                Categorie
              </th>
              <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                Niveau
              </th>
              <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                Acties
              </th>
            </tr>
          </thead>
          <tbody class="bg-white divide-y divide-gray-200">
            <tr *ngFor="let criteria of filteredCriteria">
              <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">
                {{ criteria.id }}
              </td>
              <td class="px-6 py-4 text-sm text-gray-500">
                {{ criteria.description }}
              </td>
              <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                {{ getCategoryDisplay(criteria.category) }}
              </td>
              <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                {{ criteria.level }}
              </td>
              <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                <button class="text-primary-600 hover:text-primary-900 mr-3" (click)="onEdit(criteria)">
                  Bewerken
                </button>
                <button class="text-red-600 hover:text-red-900" (click)="onDelete(criteria)">
                  Verwijderen
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
