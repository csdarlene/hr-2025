spring:
  application:
    name: hr-performance-system
  
  # Database Configuration
  datasource:
    url: jdbc:oracle:thin:@//localhost:1521/FREEPDB1
    username: SYSTEM
    password: root
    driver-class-name: oracle.jdbc.OracleDriver
  
  # JPA/Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.Oracle12cDialect
        jdbc:
          lob:
            non_contextual_creation: true
  sql:
    init:
      mode: always
  jackson:
    serialization:
      fail-on-empty-beans: false
   
  mail:
    host: smtp.gmail.com
    port: 587
    username: your-email@gmail.com
    password: your-email-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
        transport:
          protocol: smtp
          debug: true
  
  # Server Configuration
  server:
    port: 8080
    servlet:
      context-path: /api
  
  # Logging
  logging:
    level:
      root: INFO
      com.qualogy.hr: DEBUG
    file:
      name: logs/application.log
  
  # Cache Configuration
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=300s

# JWT Configuration
app:
  file:
    upload-dir: uploads
    max-file-size: 10MB
    allowed-file-types: .pdf,.doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png

  jwt:
    secret: qualogy-hr-system
    expiration-ms: 86400000 # 24 hours
    refresh-expiration-ms: 604800000 # 7 days
    issuer: qualogy-hr-system

# OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    doc-expansion: none

# Security Configuration
security:
  cors:
    allowed-origins: http://localhost:4200
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: *
    allow-credentials: true

cors:
  allowed-origins: http://localhost:4200
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: '*'
  allow-credentials: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.75,0.9,0.95,0.99